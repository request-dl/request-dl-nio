name: CI

on:
  push:
    branches: [main]
    paths:
      - 'Package.swift'
      - 'Sources/**'
      - 'Tests/**'
      - '.swift-format'
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
    paths:
      - 'Package.swift'
      - 'Sources/**'
      - 'Tests/**'
      - '.swift-format'
      - '.github/workflows/swift-ci.yaml'
  workflow_dispatch: {}

# Cancel any in-progress or queued run for the same ref when a new run is
# triggered (e.g. new push), so stale xcodebuild/swift test processes don't
# keep running and don't sit blocking the queue. Pushes to main use
# github.run_id so each run gets its own group instead of sharing one by
# ref — sharing by ref there can make cancel-in-progress try to cancel a
# run against itself while it's inside the reusable "Swift CI" workflow,
# which GitHub Actions reports as a concurrency deadlock.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.run_id || github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: "Swift CI"
    # Skip draft PRs -- `pull_request`'s `synchronize`/`opened`/`reopened` fire regardless of
    # draft state, so this has to be a job-level condition, not a trigger filter. Push events
    # (main) have no `pull_request` payload at all, hence the `event_name` guard first.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    uses: request-dl/.github/.github/workflows/swift-ci.yaml@ci/enable-windows-third-party-tests
    with:
      name: request-dl
      product-name: RequestDL
      swift-version: '6.4'
      platform: xcode-27

      # Step 1
      enable-header-validation: true
      header-template: |
        //
        // See LICENSE for this package's licensing information.
        //

      # Step 2
      enable-format: true
      format-swift-version: '6.4'

      # Step 3
      # Off until swift package diagnose-api-breaking-changes works on the xcode-27 image.
      enable-breaking-changes: false
      skip-on-major-update: true
      force-skip-breaking-changes: ${{ contains(github.event.pull_request.labels.*.name, 'force-skip-ci') }}

      # Step 4 – Apple
      enable-apple-tests: true
      package-name: "request-dl"
      xcode-version: '27.2'
      apple-coverage-enabled: true
      # Xcode's compilation cache for the Apple tests (request-dl/.github#121). Pull requests only
      # restore it; a push to main saves it, so the first run after this lands on main fills it.
      apple-tests-compilation-cache-enabled: true
      apple-tests-max-parallelization-width: '2'
      apple-tests-parallel-testing-worker-count: '2'
      # 30 (the workflow's own default) was observed getting hit by a legitimately still-running
      # tvOS job -- not a hang, just a slow day on a contended Simulator runner -- which the job
      # timeout then cut off mid-suite with no test report at all. 45 gives real headroom for that
      # without masking an actual hang: apple-tests-crash-watch-enabled/-grace-minutes (workflow
      # defaults: on, 12 minutes) already fail a genuinely stuck run well before 45 minutes,
      # independently of this budget.
      apple-tests-timeout-minutes: 45
      # watchOS also gets `rerun`: the runner unmounts the watchOS 27.0 runtime about every 10 minutes
      # (see #441), which kills the tests running at that moment; they are run again alone.
      # Same destinations the workflow runs by default, spelled out only to give visionOS a budget
      # of its own. Its Simulator is the slowest of the set: when it finishes, it takes 21 to 44
      # minutes, and 16 of the jobs run over the last few days were cut off by the 45-minute cap
      # ("exceeded the maximum execution time") while still working through the suite -- the last
      # lines of their logs are tests passing, not a hang. A genuine hang is still caught long
      # before this, by apple-tests-crash-watch-enabled above.
      apple-tests-matrix: >-
        [{"destination":"platform=iOS Simulator,arch=arm64,name=iPhone 18 Pro,OS=27.2","name":"iOS"},
        {"destination":"platform=iOS Simulator,arch=arm64,name=iPad (A16),OS=27.2","name":"iPadOS"},
        {"destination":"platform=watchOS Simulator,arch=arm64,name=Apple Watch Series 12 (42mm),OS=27.2","name":"watchOS","rerun":1},
        {"destination":"platform=tvOS Simulator,arch=arm64,name=Apple TV 4K (4th generation) (at 1080p),OS=27.2","name":"tvOS"},
        {"destination":"platform=visionOS Simulator,arch=arm64,name=Apple Vision Pro,OS=27.2","name":"visionOS","timeout":75},
        {"destination":"platform=macOS,arch=arm64,name=My Mac","name":"macOS"},
        {"destination":"platform=macOS,arch=arm64,variant=Mac Catalyst,name=My Mac","name":"macOS Catalyst"}]

      # Apple destinations that are only built. watchOS devices run arm64_32, where Int has 32
      # bits; the watchOS job above runs on the arm64 Simulator, where it has 64, so a literal
      # such as 2_147_483_648 compiles there and breaks the build of an app archived for a watch.
      apple-build-only-matrix: >-
        [{"destination":"generic/platform=watchOS","name":"watchOS device"}]

      # Step 4 – Third Party
      enable-third-party-tests: true
      third-party-coverage-enabled: true
      # The Linux job is the workflow's own default, repeated here because setting the input
      # replaces it. The macOS job builds and runs the suite with the NIOTransport trait off, so
      # the URLSession executor is what gets tested; setup-swift is false because that job needs
      # the Apple SDK frameworks of the runner's Xcode. Takes 9 to 19 minutes, hence the 30.
      third-party-tests-matrix: >-
        [{"platform":"ubuntu-latest","name":"Linux"},
        {"platform":"xcode-27","name":"macOS URLSession-only","args":"--disable-default-traits","setup-swift":false,"timeout":30}]

      # Step 4 – Linkage Test (renomeado de test-foundation-essentials)
      enable-linkage-test: true

      # Step 4 – Android Build
      enable-android-build: true

      # Step 4 – Release Builds / Static SDK
      enable-release-builds: true
      enable-static-sdk: true

      # Step 5
      enable-coverage-upload: true
    secrets: inherit
