name: CI

on:
  push:
    branches: [main]
    paths:
      - 'Package.swift'
      - 'Sources/**'
      - 'Tests/**'
      - '.swift-format'
  pull_request:
    branches: [main]
    paths:
      - 'Package.swift'
      - 'Sources/**'
      - 'Tests/**'
      - '.swift-format'
      - '.github/workflows/swift-ci.yaml'

# Cancel any in-progress or queued run for the same ref when a new run is
# triggered (e.g. new push), so stale xcodebuild/swift test processes don't
# keep running and don't sit blocking the queue. Pushes to main use
# github.run_id so each run gets its own group instead of sharing one by
# ref — sharing by ref there can make cancel-in-progress try to cancel a
# run against itself while it's inside the reusable "Swift CI" workflow,
# which GitHub Actions reports as a concurrency deadlock.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.run_id || github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: "Swift CI"
    # TEMP: pointed at the .github Android-build fix branch instead of @main
    # while request-dl/.github#94 is still in flight, so we can iterate on
    # android-build failures without merging to .github's main each time.
    # Revert to @main once #94 merges.
    uses: request-dl/.github/.github/workflows/swift-ci.yaml@ci/android-sdk-fix
    with:
      name: request-dl
      product-name: RequestDL
      swift-version: '6.2'
      platform: macos-26

      # Step 1
      enable-format: true
      format-swift-version: '6.3'

      # Step 2
      enable-breaking-changes: true
      skip-on-major-update: true
      force-skip-breaking-changes: ${{ contains(github.event.pull_request.labels.*.name, 'force-skip-ci') }}

      # Step 3 – Apple
      enable-apple-tests: true
      package-name: "request-dl"
      xcode-version: '26.6'
      apple-coverage-enabled: true
      apple-tests-parallel-testing-worker-count: '2'

      # Step 3 – Third Party
      enable-third-party-tests: true
      third-party-coverage-enabled: true

      # Step 3 – Linkage Test (renomeado de test-foundation-essentials)
      enable-linkage-test: true

      # Step 3 – Android Build
      enable-android-build: true

      # Step 4
      enable-coverage-upload: true
    secrets: inherit