name: CI

on:
  push:
    branches: [main]
    paths:
      - 'Package.swift'
      - 'Sources/**'
      - 'Tests/**'
      - '.swift-format'
  pull_request:
    branches: [main]
    paths:
      - 'Package.swift'
      - 'Sources/**'
      - 'Tests/**'
      - '.swift-format'
      - '.github/workflows/swift-ci.yaml'

# Cancel any in-progress or queued run for the same ref when a new run is
# triggered (e.g. new push), so stale xcodebuild/swift test processes don't
# keep running and don't sit blocking the queue. Pushes to main use
# github.run_id so each run gets its own group instead of sharing one by
# ref — sharing by ref there can make cancel-in-progress try to cancel a
# run against itself while it's inside the reusable "Swift CI" workflow,
# which GitHub Actions reports as a concurrency deadlock.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.run_id || github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: "Swift CI"
    # Skip draft PRs -- `pull_request`'s `synchronize`/`opened`/`reopened` fire regardless of
    # draft state, so this has to be a job-level condition, not a trigger filter. Push events
    # (main) have no `pull_request` payload at all, hence the `event_name` guard first.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    uses: request-dl/.github/.github/workflows/swift-ci.yaml@claude/apple-tests-crash-watch-timeouts-1de062
    with:
      name: request-dl
      product-name: RequestDL
      swift-version: '6.2'
      platform: macos-26

      # Step 1
      enable-header-validation: true
      header-template: |
        //
        // See LICENSE for this package's licensing information.
        //

      # Step 2
      enable-format: true
      format-swift-version: '6.3'

      # Step 3
      enable-breaking-changes: true
      skip-on-major-update: true
      force-skip-breaking-changes: ${{ contains(github.event.pull_request.labels.*.name, 'force-skip-ci') }}

      # Step 4 – Apple
      enable-apple-tests: true
      package-name: "request-dl"
      xcode-version: '26.6'
      apple-coverage-enabled: true
      apple-tests-max-parallelization-width: '2'
      apple-tests-parallel-testing-worker-count: '2'
      # 30 (the workflow's own default) was observed getting hit by a legitimately still-running
      # tvOS leg -- not a hang, just a slow day on a contended Simulator runner -- which the job
      # timeout then cut off mid-suite with no test report at all. 45 gives real headroom for that
      # without masking an actual hang: apple-tests-crash-watch-enabled/-grace-minutes (workflow
      # defaults: on, 12 minutes) already fail a genuinely stuck run well before 45 minutes,
      # independently of this budget.
      apple-tests-timeout-minutes: 45

      # Step 4 – Third Party
      enable-third-party-tests: true
      third-party-coverage-enabled: true

      # Step 4 – Linkage Test (renomeado de test-foundation-essentials)
      enable-linkage-test: true

      # Step 4 – Android Build
      enable-android-build: true

      # Step 4 – Release Builds / Static SDK
      enable-release-builds: true
      enable-static-sdk: true

      # Step 5
      enable-coverage-upload: true
    secrets: inherit
